<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpPet - Pesquisa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">
            <img src="Logo.png" alt="HelpPet Logo">
        </div>
        <div class="back-button">
            <img src="./left_arrow.png" alt="Voltar">
        </div>
    </header>

    <main class="container">
        <section class="content-card">
            <h1>O que esta procurando?</h1>

            <div class="categorias-grid">
                <div class="categoria-item">
                    <div class="icone-box">🐕</div>
                    <span class="legenda vinho">Cachorros</span>
                </div>
                <div class="categoria-item">
                    <div class="icone-box">🐈</div>
                    <span class="legenda azul-escuro">Gatos</span>
                </div>
                <div class="categoria-item">
                    <div class="icone-box">🐒</div>
                    <span class="legenda verde-escuro">Macacos</span>
                </div>
                <div class="categoria-item">
                    <div class="icone-box">🐾</div>
                    <span class="legenda preto">Filhotes</span>
                </div>
                <div class="categoria-item">
                    <div class="icone-box">📍</div>
                    <span class="legenda vinho">+ Proximos</span>
                </div>
            </div>

            <div class="busca-container">
                <div class="busca-barra">
                    <span class="busca-lupa">
                        <img src="./Lupa.png" alt="Buscar">
                    </span>
                    <input type="text" placeholder="O que está procurando?" class="busca-input">                    
                </div>
            </div>

            <div class="rodape-ilustracao">
                <img src="./Bugs 1.png" alt="Ilustração de busca" class="img-personagem">
                <p class="texto-ajuda">Clique no botão de pesquisa e escreva o que deseja encontrar</p>
            </div>
        </section>

    </main>

</body>
</html>
